name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

      - name: Build regression test binary
        run: swift build -c release

      - name: Run regression tests
        run: |
          python3 Tests/test_cli.py
          swiftc Sources/LuLuCLI/Logs.swift Tests/LogsTests.swift -o "$RUNNER_TEMP/lulu-log-tests"
          "$RUNNER_TEMP/lulu-log-tests"

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/lulu-cli lulu-cli
          chmod +x lulu-cli
          tar czf "lulu-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz" lulu-cli
          shasum -a 256 "lulu-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz" > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "lulu-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
